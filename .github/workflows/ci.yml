name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  # -------------------------------------------------------------------------
  # Lint
  # -------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check booking_system/

  # -------------------------------------------------------------------------
  # Tests (SQLite — fast, most tests)
  # -------------------------------------------------------------------------
  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          cd booking_system
          python manage.py test bookings --verbosity=2
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-test-key-not-for-production"

  # -------------------------------------------------------------------------
  # Tests (PostgreSQL — concurrency + full suite)
  # -------------------------------------------------------------------------
  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_db
          POSTGRES_USER: booking_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt psycopg[binary]
      - name: Run tests
        run: |
          cd booking_system
          python manage.py test bookings --verbosity=2
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-test-key-not-for-production"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: booking_db
          DB_USER: booking_user
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: "5432"

  # -------------------------------------------------------------------------
  # Docker build check
  # -------------------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test-sqlite, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: booking-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
